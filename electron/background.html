<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>背景设置</title>
    <style>
      * { box-sizing: border-box; }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1c1f;
        color: #eceef2;
        font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      body { display: flex; flex-direction: column; padding: 20px 22px; gap: 18px; }

      h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }
      .sub { margin: 2px 0 0; font-size: 12px; color: #868d9b; }

      .card {
        border: 1px solid #2c2f36;
        border-radius: 10px;
        background: #202226;
        padding: 14px 15px;
      }

      .fileRow { display: flex; align-items: center; gap: 12px; }
      .fileInfo { flex: 1; min-width: 0; }
      .fileLabel { font-size: 11px; color: #868d9b; margin-bottom: 3px; }
      .fileName {
        font-size: 12.5px;
        color: #cfd4de;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fileName.empty { color: #6b7280; font-style: italic; }

      button {
        font: inherit;
        color: #dfe3ea;
        background: #2b2f37;
        border: 1px solid #3a3f49;
        border-radius: 7px;
        padding: 7px 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover { background: #333843; border-color: #454b57; }
      button:active { background: #292d35; }
      button.primary { background: #3550d8; border-color: #4d6bfe; color: #fff; }
      button.primary:hover { background: #3f5ce8; }
      button:disabled { opacity: 0.45; cursor: default; }
      button:disabled:hover { background: #2b2f37; border-color: #3a3f49; }

      .field { margin-bottom: 16px; }
      .field:last-child { margin-bottom: 0; }
      .fieldHead {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 7px;
      }
      .fieldHead span:first-child { font-size: 12.5px; color: #cfd4de; }
      .value {
        font-size: 12px;
        color: #8ea2ff;
        font-variant-numeric: tabular-nums;
        min-width: 40px;
        text-align: right;
      }
      .hint { margin: 6px 0 0; font-size: 11px; color: #757c8a; }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 3px;
        background: #343943;
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #4d6bfe;
        border: 2px solid #1b1c1f;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
        cursor: grab;
      }
      input[type="range"]::-webkit-slider-thumb:active { cursor: grabbing; }
      input[type="range"]:disabled { opacity: 0.4; cursor: default; }
      input[type="range"]:disabled::-webkit-slider-thumb { cursor: default; }

      .spacer { flex: 1; }
      .footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .notice { font-size: 11px; color: #757c8a; }
    </style>
  </head>
  <body>
    <header>
      <h1>背景设置</h1>
      <p class="sub">背景图铺满窗口，界面面板半透明后从上面透出来</p>
    </header>

    <div class="card">
      <div class="fileRow">
        <div class="fileInfo">
          <div class="fileLabel">背景图片</div>
          <div class="fileName empty" id="fileName">未设置</div>
        </div>
        <button class="primary" id="choose">选择图片…</button>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <div class="fieldHead">
          <span>界面不透明度</span>
          <span class="value" id="uiValue">78%</span>
        </div>
        <input type="range" id="uiOpacity" min="20" max="100" step="1" value="78" />
        <p class="hint">调低则侧边栏、对话区、卡片更透明，背景图更明显。文字始终保持不透明。</p>
      </div>

      <div class="field">
        <div class="fieldHead">
          <span>背景压暗</span>
          <span class="value" id="dimValue">25%</span>
        </div>
        <input type="range" id="dim" min="0" max="85" step="1" value="25" />
        <p class="hint">背景图太亮时调高，压一层黑让上面的文字更好认。</p>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="footer">
      <button id="clear">清除背景</button>
      <span class="notice" id="notice"></span>
      <button id="close">关闭</button>
    </div>

    <script src="background-ui.js"></script>
  </body>
</html>
